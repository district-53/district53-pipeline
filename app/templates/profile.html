<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ user.username }} — Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="main-content">
        <div class="center-column">
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="flash-box">
                        {% for msg in messages %}
                            <div>{{ msg }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <div class="book-wrapper">
                <div class="book">
                    <div class="page">
                        {% if current_user.id == user.id %}

                            <form method="POST"
                                  action="{{ url_for('profile.view_profile', user_id=user.id) }}"
                                  enctype="multipart/form-data"
                                  class="profile-edit-wrapper">

                                <div class="profile-row">

                                    <div class="avatar-column">
                                        <label for="photo-input" class="avatar-upload-label" title="Click to change photo">
                                            {% if user.photo_id %}
                                                <img id="avatar-preview" class="portrait"
                                                     src="{{ url_for('pictures.get_picture', picture_id=user.photo_id) }}"
                                                     alt="{{ user.username }}">
                                            {% else %}
                                                <div id="avatar-placeholder" class="portrait">no photo</div>
                                                <img id="avatar-preview" class="portrait" style="display: none;" alt="Preview">
                                            {% endif %}
                                            <span class="upload-hint">Change photo</span>
                                        </label>
                                        <input type="file" id="photo-input" name="photo" accept="image/*" hidden>
                                    </div>

                                    <div class="profile-details">
                                        <div class="form-group">
                                            <label>Username</label>
                                            <input type="text" name="username" value="{{ user.username }}" required>
                                        </div>

                                        <div class="form-group">
                                            <label>Email</label>
                                            <input type="email" name="email" value="{{ user.email }}" required>
                                        </div>

                                        <div class="form-group">
                                            <label>New Password (leave blank to keep current)</label>
                                            <input type="password" name="password" placeholder="••••••••">
                                        </div>

                                        <div class="form-group">
                                            <label>Role</label>
                                            <select name="role" id="role-select">
                                                <option value="knight" {% if user.role == 'knight' %}selected{% endif %}>Knight</option>
                                                <option value="noble" {% if user.role == 'noble' %}selected{% endif %}>Noble</option>
                                            </select>
                                        </div>

                                        <div class="form-group" id="house-group">
                                            <label>House</label>
                                            <select name="house_id">
                                                <option value="">— No House —</option>
                                                {% for h in houses %}
                                                    <option value="{{ h.id }}" {% if user.house_id == h.id %}selected{% endif %}>
                                                        {{ h.name }}
                                                    </option>
                                                {% endfor %}
                                            </select>
                                            {% if user.house %}
                                                <p class="motto"><i>«{{ user.house.motto }}»</i></p>
                                            {% endif %}
                                        </div>


                                        <div class="stats-edit-grid" id="knight-stats-group"
                                             style="{% if user.role != 'knight' %}display: none;{% endif %}">
                                            <div class="form-group">
                                                <label>Strength</label>
                                                <input type="number" name="strength" value="{{ knight.strength if knight else 10 }}">
                                            </div>
                                            <div class="form-group">
                                                <label>Dexterity</label>
                                                <input type="number" name="dexterity" value="{{ knight.dexterity if knight else 10 }}">
                                            </div>
                                            <div class="form-group">
                                                <label>Constitution</label>
                                                <input type="number" name="constitution" value="{{ knight.constitution if knight else 10 }}">
                                            </div>
                                        </div>

                                        <button type="submit" class="btn btn-small">Save changes</button>
                                    </div>
                                </div>
                            </form>
                        {% else %}
                            
                            </div>
                        {% endif %}


                        <div class="page-footer footer-row">
                            <a href="{{ url_for('book.book', kind=user.role if user.role in ('knight', 'noble') else 'knight', id=user.id) }}" class="logout-btn" title="Book">
                                Book
                            </a>
                            <a href="{{ url_for('auth.logout') }}" class="logout-btn" title="Log out">
                                Log out ⏻
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    
</body>
</html>
