<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card">
        <div class="roles">
            <a href="{{ url_for('auth.signup', role='commonfolk') }}" class="btn {% if role == 'commonfolk' %}active{% endif %}">commonfolk</a>
            <a href="{{ url_for('auth.signup', role='knight') }}" class="btn {% if role == 'knight' %}active{% endif %}">knight</a>
            <a href="{{ url_for('auth.signup', role='noble') }}" class="btn {% if role == 'noble' %}active{% endif %}">noble</a>
        </div>

        <form class="form-box" method="post" action="{{ url_for('auth.signup', role=role) }}">
            <input type="text" name="username" placeholder="username" required>
            <input type="email" name="email" placeholder="email" required>
            <input type="password" name="password" placeholder="password" required>
            <div class="upload-box">upload photo</div>

            {% if role in ['knight', 'noble'] %}
                <select name="house_id" required>
                    <option value="">choose house</option>
                    {% for house in houses %}
                        <option value="{{ house.id }}">{{ house.name }}</option>
                    {% endfor %}
                </select>
            {% endif %}

            {% if role == 'knight' %}
                <input type="number" name="strength" placeholder="strength (1-100)" min="1" max="100" required>
                <input type="number" name="dexterity" placeholder="dexterity (1-100)" min="1" max="100" required>
                <input type="number" name="constitution" placeholder="constitution (1-100)" min="1" max="100" required>
            {% endif %}
            <button type="submit" class="btn">confirm</button>
        </form>
        <a href="{{ url_for('auth.login') }}">already registered? log in</a>
    </div>
</body>
</html>
