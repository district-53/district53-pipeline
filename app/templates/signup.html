<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card">
        <div class="roles">
            <a href="/signup/commonfolk" class="btn {% if role == 'commonfolk' %}active{% endif %}">commonfolk</a>
            <a href="/signup/knight" class="btn {% if role == 'knight' %}active{% endif %}">knight</a>
            <a href="/signup/noble" class="btn {% if role == 'noble' %}active{% endif %}">noble</a>
        </div>

        <div class="form-box">
            <input type="text" placeholder="username">
            <input type="password" placeholder="password">
            <div class="upload-box">upload photo</div>

            {% if role in ['knight', 'noble'] %}
                <input type="text" placeholder="house">
            {% endif %}

            {% if role == 'knight' %}
                <input type="number" placeholder="strength">
                <input type="number" placeholder="agility">
                <input type="number" placeholder="endurance">
            {% endif %}
        </div>

        <a href="/book" class="btn">confirm</a>
    </div>
</body>
</html>
